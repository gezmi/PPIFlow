# PPIFlow Two-Round De Novo Nanobody (VHH) Design Pipeline
#
# Two rounds: de novo generation → AF3Score filter → enrichment →
#   partial flow refinement → final validation
#
# Usage:
#   snakemake --snakefile workflow/Snakefile \
#     --configfile workflow/config_nanobody_full.yaml \
#     --config input_file=/path/to/receptor.pdb output_dir=/path/to/output \
#       af3score_dir=/path/to/af3score af3_home=/path/to/af3 \
#     target_nanobody_full

# --- Required ---
input_file: "/path/to/receptor.pdb"
output_dir: "/path/to/output"

# --- Pipeline mode ---
mode: "nanobody_full"

# --- Chain IDs ---
antigen_chain: "C"
heavy_chain: "A"

# --- Framework ---
# framework_pdb: "Framework/7xl0_nanobody_framework.pdb"  # default
# cdr_length: "CDRH1,5-12,CDRH2,4-17,CDRH3,5-26"         # default

# --- Round 1: De novo generation + AbMPNN ---
r1_samples_per_target: 100       # backbone samples (scale up to 25K for production)
n_gen_chunks: 1                  # parallel GPU jobs for generation (e.g. 10 for 2500 backbones)
r1_num_seq_per_target: 8         # AbMPNN sequences per backbone
r1_sampling_temp: "0.5"          # AbMPNN temperature (paper: 0.5)
r1_iptm_threshold: 0.2           # AF3Score ipTM filter for R1

# --- Round 2: Partial flow refinement ---
r2_start_t: 0.6                  # partial flow start_t (higher = more conservative)
r2_samples_per_backbone: 8       # partial flow samples per enriched backbone
r2_num_seq_per_target: 4         # AbMPNN sequences per R2 backbone
r2_sampling_temp: "0.1"          # AbMPNN temperature (paper: 0.1)
r2_iptm_threshold: 0.5           # AF3Score ipTM filter for R2
r2_ptm_threshold: 0.8            # AF3Score ptm_A filter for R2

# --- CDR interface ratio filtering (after backbone generation) ---
cdr_interface_ratio_threshold: 0.6

# --- FlowPacker (GPU sidechain packing, replaces PyRosetta) ---
flowpacker_dir: "/home/labs/schreiber/juliav/tools/flowpacker"
flowpacker_ckpt: "cluster.pth"    # in {flowpacker_dir}/checkpoints/

# --- Enrichment ---
energy_threshold: -5.0            # REU cutoff for key contact detection

# --- Final ranking ---
final_dockq_threshold: 0.49
final_iptm_threshold: 0.7
final_ptm_threshold: 0.8
final_top_n: 30

# --- Flexible target residues (optional) ---
# flexible_target_residues: "C45,C50-55"  # Target residues to perturb
# flexibility_sigma: 0.5                   # Noise magnitude (Angstroms)

# --- Rosetta relax ---
# relax_method: "interface"   # "interface" (fast, default) or "full" (unconstrained)

# --- AF3Score ---
# af3score_dir: "/path/to/af3score"
# af3score_num_jobs: 25

# --- AF3 Refold ---
# af3_home: "/path/to/af3"
# af3_refold_seeds: 20
